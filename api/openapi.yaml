openapi: 3.1.0
info:
  title: GardenSwap API
  description: 'Hyperlocal gardening exchange: seedling swaps, harvest swaps, pick-your-own
    slots, plant sitting, and a fungible credit economy.'
  version: 0.1.0
paths:
  /healthz:
    get:
      tags:
      - ops
      summary: Healthz
      description: Liveness probe. Auth-exempt; must stay cheap and dependency-free.
      operationId: healthz_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Healthz Healthz Get
  /v1/users:
    post:
      tags:
      - users
      summary: Upsert Profile
      description: Create or update the caller's own profile. uid comes from the ID
        token.
      operationId: upsert_profile_v1_users_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerProfile'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /v1/users/me:
    get:
      tags:
      - users
      summary: Get Me
      operationId: get_me_v1_users_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerProfile'
      security:
      - bearerAuth: []
    delete:
      tags:
      - users
      summary: Delete Me
      description: 'Delete the caller''s account and all of their data (C6).


        Deletion policy: immediate and irreversible — no grace period. This is

        acceptable pre-launch (no production data exists); revisit before launch

        if a retention/grace window becomes a compliance requirement.

        Dependent rows cascade in Postgres via ON DELETE CASCADE (migration

        0024 adds the two FKs that were missing); the in-memory repos used in

        tests mirror that cascade. Idempotent: deleting twice still returns 204.'
      operationId: delete_me_v1_users_me_delete
      responses:
        '204':
          description: Successful Response
      security:
      - bearerAuth: []
    patch:
      tags:
      - users
      summary: Patch Me
      operationId: patch_me_v1_users_me_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerProfile'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /v1/users/{uid}:
    get:
      tags:
      - users
      summary: Get Public Profile
      description: Anyone authenticated can see the public profile — no PII, no home_zip.
      operationId: get_public_profile_v1_users__uid__get
      parameters:
      - name: uid
        in: path
        required: true
        schema:
          type: string
          title: Uid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProfile'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /v1/users/me/export:
    get:
      tags:
      - users
      summary: Export Me
      description: "Export everything the backend stores about the caller (C6).\n\n\
        Shape — every section is scoped to the caller, never anyone else's rows:\n\
        {\n  \"uid\": ..., \"exported_at\": ...,\n  \"profile\": <owner profile>,\n\
        \  \"listings\": [...],        # listing rows incl. trees; geo decrypted\n\
        \  \"claims\": [...],          # partial-quantity claims filed by the user\n\
        \  \"credit_ledger\": [...],   # full append-only ledger history\n  \"want_list\"\
        : [...],\n  \"harvest_events\": [...],  # pick events on the user's listings\n\
        \  \"notification_prefs\": {...} | null,\n  \"threads\": [...],         #\
        \ threads the user participates in\n  \"messages_sent\": [...],    # messages\
        \ sent by the user, bodies decrypted\n}\nEncrypted fields are decrypted for\
        \ the owner (fail closed on tamper /\nmissing key, like every other read path).\
        \ Datetimes are ISO strings."
      operationId: export_me_v1_users_me_export_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Export Me V1 Users Me Export Get
      security:
      - bearerAuth: []
  /v1/users/me/credit-expiry:
    get:
      tags:
      - credits
      summary: Credit Expiry
      description: 'Credit expiry outlook: effective balance, tranches expiring within
        the

        next 30 days (covers both the 30-day and 7-day warning windows), and the

        end of the current season.'
      operationId: credit_expiry_v1_users_me_credit_expiry_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Credit Expiry V1 Users Me Credit Expiry Get
      security:
      - bearerAuth: []
  /v1/auth/verify:
    post:
      tags:
      - auth
      summary: Verify Phone
      operationId: verify_phone_v1_auth_verify_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Verify Phone V1 Auth Verify Post
      security:
      - bearerAuth: []
  /v1/idv/session:
    post:
      tags:
      - idv
      summary: Create Session
      operationId: create_session_v1_idv_session_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Create Session V1 Idv Session Post
      security:
      - bearerAuth: []
  /v1/idv/webhook:
    post:
      tags:
      - idv
      summary: Idv Webhook
      description: Auth-exempt (no user token possible); secured by HMAC signature
        only.
      operationId: idv_webhook_v1_idv_webhook_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Idv Webhook V1 Idv Webhook Post
  /v1/idv/stub/decide:
    post:
      tags:
      - idv
      summary: Stub Decide
      description: 'TEST-ONLY: acts as the stub vendor delivering a signed verdict
        webhook.


        Gated on the explicit ``ENABLE_IDV_STUB=1`` opt-in — never on the

        provider name. Without the opt-in this route is dead (404), so a deploy

        that forgot ``IDV_PROVIDER`` cannot be self-verified.'
      operationId: stub_decide_v1_idv_stub_decide_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StubDecision'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Stub Decide V1 Idv Stub Decide Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /v1/listings:
    post:
      tags:
      - listings
      summary: Create Listing
      operationId: create_listing_v1_listings_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Create Listing V1 Listings Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /v1/listings/mine:
    get:
      tags:
      - listings
      summary: List My Listings
      description: Listings owned by the current user, any status, newest first.
      operationId: list_my_listings_v1_listings_mine_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response List My Listings V1 Listings Mine Get
      security:
      - bearerAuth: []
  /v1/want-list/matches:
    get:
      tags:
      - listings
      - want-list
      summary: Get Want Matches
      description: 'Live listings matching the current user''s want-list entries.


        Defined here (not in wantlist.py) to avoid a listings<->wantlist

        circular import; the route path is unchanged.'
      operationId: get_want_matches_v1_want_list_matches_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Get Want Matches V1 Want List Matches Get
      security:
      - bearerAuth: []
  /v1/listings/{listing_id}:
    get:
      tags:
      - listings
      summary: Get Listing
      operationId: get_listing_v1_listings__listing_id__get
      parameters:
      - name: listing_id
        in: path
        required: true
        schema:
          type: string
          title: Listing Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Listing V1 Listings  Listing Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
    patch:
      tags:
      - listings
      summary: Patch Listing
      operationId: patch_listing_v1_listings__listing_id__patch
      parameters:
      - name: listing_id
        in: path
        required: true
        schema:
          type: string
          title: Listing Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingPatch'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Patch Listing V1 Listings  Listing Id  Patch
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /v1/listings/{listing_id}/cancel:
    post:
      tags:
      - listings
      summary: Cancel Listing
      operationId: cancel_listing_v1_listings__listing_id__cancel_post
      parameters:
      - name: listing_id
        in: path
        required: true
        schema:
          type: string
          title: Listing Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Cancel Listing V1 Listings  Listing Id  Cancel Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /v1/harvest-events:
    post:
      tags:
      - listings
      - listings
      summary: Record Harvest Event
      description: 'Record kilos picked from a harvest listing (owner only, live only).


        Atomic decrement — concurrent pickers cannot oversell. When the harvest

        is fully picked (remaining hits ~0) the listing completes via one

        conditional live -> completed flip (M6): a single commit, so a crash can

        never strand the listing in claimed with no sweeper.'
      operationId: record_harvest_event_v1_harvest_events_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HarvestEventIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Record Harvest Event V1 Harvest Events Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /v1/listings/{listing_id}/harvest-events:
    get:
      tags:
      - listings
      - listings
      summary: Get Harvest Events
      description: 'Pick audit log for a harvest listing.


        Visible to any authenticated user (the route requires auth; the

        recorder_uid values are the audit trail).'
      operationId: get_harvest_events_v1_listings__listing_id__harvest_events_get
      parameters:
      - name: listing_id
        in: path
        required: true
        schema:
          type: string
          title: Listing Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Harvest Events V1 Listings  Listing Id  Harvest
                  Events Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /v1/trees:
    get:
      tags:
      - listings
      - trees
      summary: List Trees
      description: Live tree listings for pick-your-own (API-135).
      operationId: list_trees_v1_trees_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response List Trees V1 Trees Get
      security:
      - bearerAuth: []
  /v1/trees/{listing_id}/ripe-alert:
    post:
      tags:
      - listings
      - trees
      summary: Ripe Alert
      description: 'Notify want-list matches that a tree is ripe for picking (API-050).


        Owner-only. The notify layer''s 24h dedupe on ref ``<listing>:<date>``

        makes this safe to re-trigger — each user gets at most one ripe alert

        per tree per day.'
      operationId: ripe_alert_v1_trees__listing_id__ripe_alert_post
      parameters:
      - name: listing_id
        in: path
        required: true
        schema:
          type: string
          title: Listing Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Ripe Alert V1 Trees  Listing Id  Ripe Alert Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /v1/internal/sweep:
    post:
      tags:
      - internal
      summary: Sweep Expired
      description: 'Idempotent expiry job. Auth: shared secret header (NOT a user
        token).


        Also fires expiry nudges: live listings within 48h / 12h of expiry get a

        nudge to the owner via the notify pipeline (per-mark dedupe refs keep

        this idempotent across sweep runs). The nudge scan is bounded to listings

        expiring within 48h (M9) instead of iterating every live listing.


        Retention (M19), all idempotent: notification_log older than 90d is

        purged, resolved disputes older than 2y are purged, and photos of

        terminal listings (completed/expired/cancelled) older than 180d are

        garbage-collected from the uploads registry (unserved after the C7

        registry gate) with the listing''s photo list cleared. The credit ledger,

        harvest_events, moderation_views, and reports/strikes/enforcement are

        append-only by design and never purged (see module docstring).'
      operationId: sweep_expired_v1_internal_sweep_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Sweep Expired V1 Internal Sweep Post
  /v1/uploads/sign:
    post:
      tags:
      - uploads
      summary: Sign Upload
      operationId: sign_upload_v1_uploads_sign_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Sign Upload V1 Uploads Sign Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /v1/uploads/raw/{key}:
    put:
      tags:
      - uploads
      summary: Put Raw
      description: 'Local-stub raw PUT target. (GCS backend: 501 — clients PUT to
        the signed URL.)'
      operationId: put_raw_v1_uploads_raw__key__put
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
          title: Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Put Raw V1 Uploads Raw  Key  Put
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /v1/uploads/finalize:
    post:
      tags:
      - uploads
      summary: Finalize Upload
      operationId: finalize_upload_v1_uploads_finalize_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinalizeIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Finalize Upload V1 Uploads Finalize Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /v1/users/me/notification-prefs:
    get:
      tags:
      - notifications
      summary: Get Notification Prefs
      operationId: get_notification_prefs_v1_users_me_notification_prefs_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Get Notification Prefs V1 Users Me Notification Prefs
                  Get
      security:
      - bearerAuth: []
    put:
      tags:
      - notifications
      summary: Put Notification Prefs
      operationId: put_notification_prefs_v1_users_me_notification_prefs_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrefsIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Put Notification Prefs V1 Users Me Notification Prefs
                  Put
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /v1/users/me/fcm-token:
    post:
      tags:
      - notifications
      summary: Register Fcm Token
      description: 'Register (or refresh) a device FCM registration token for push.


        Called by the Android client after sign-in and whenever

        ``FirebaseMessaging.getInstance().token`` rotates. Idempotent per

        (user, token). Returns a success flag — the token itself is a secret

        and is never echoed back (L4d).'
      operationId: register_fcm_token_v1_users_me_fcm_token_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FcmTokenIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Register Fcm Token V1 Users Me Fcm Token Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
    delete:
      tags:
      - notifications
      summary: Delete Fcm Token
      description: 'Deregister a device FCM registration token (M21).


        Called by the Android client on sign-out / uninstall / token rotation.

        Idempotent: removing a token that isn''t registered returns

        ``removed: false`` (200), never 404.'
      operationId: delete_fcm_token_v1_users_me_fcm_token_delete
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FcmTokenDeleteIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Delete Fcm Token V1 Users Me Fcm Token Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /v1/feed:
    get:
      tags:
      - feed
      summary: Get Feed
      description: 'Ranked discovery feed of live listings (fuzzed geo, no PII).


        Without ``way``: the scored, cursor-paginated feed (API-021). Pagination

        is DB-level (M9): one page of rows is fetched with limit/offset and only

        that page is scored in Python, so per-request work stays bounded no

        matter how large the listings table grows.

        With ``way`` (API-123): exact ``{"listings": [...]}`` for one Explore

        way-card, ranked freshest-first by expiry ascending (nulls last) —

        except ``way=sitting``, which returns sitter profiles under a

        ``{"sitters": [...]}`` key (L4c).'
      operationId: get_feed_v1_feed_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 20
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: way
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^(seedling|harvest|pick|sitting)$
          - type: 'null'
          title: Way
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Feed V1 Feed Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /v1/want-list:
    get:
      tags:
      - want-list
      summary: List Wants
      operationId: list_wants_v1_want_list_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response List Wants V1 Want List Get
      security:
      - bearerAuth: []
    post:
      tags:
      - want-list
      summary: Create Want
      operationId: create_want_v1_want_list_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WantIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Create Want V1 Want List Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /v1/want-list/{want_id}:
    patch:
      tags:
      - want-list
      summary: Patch Want
      operationId: patch_want_v1_want_list__want_id__patch
      parameters:
      - name: want_id
        in: path
        required: true
        schema:
          type: string
          title: Want Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WantPatch'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Patch Want V1 Want List  Want Id  Patch
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
