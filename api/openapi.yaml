  /v1/threads/{thread_id}/attachments:
    post:
      tags:
      - messaging
      - messaging
      summary: Attach Photo
      description: "Attach a photo to a thread as a \"photo\"-kind message. Participants\
        \ only.\n\nC8 contract: chat photos MUST come through the ``/v1/uploads``\
        \ pipeline\n(sign -> PUT -> finalize) so EXIF GPS stripping applies uniformly.\
        \ The\nclient sends ``uploadKey`` — the ``u/<uid>/<id>.<ext>`` key returned\
        \ by\n``POST /v1/uploads/sign`` — never a URL.\n\nServer-side verification,\
        \ in order:\n\n1. Key shape: must match the upload key format. Arbitrary external\
        \ URLs\n   (http(s) or otherwise) are rejected with 422.\n2. Ownership: the\
        \ key's ``<uid>`` segment must be the sender — 403\n   otherwise.\n3. Pipeline:\
        \ ``storage.finalize`` is (re-)run server-side. It proves the\n   bytes exist,\
        \ are a real image within the size cap, and — crucially —\n   writes back\
        \ the GPS-stripped rendition, so the attached bytes are\n   guaranteed EXIF-clean\
        \ no matter what the client did. ``finalize`` is\n   idempotent, so keys the\
        \ client already finalized are unaffected; keys\n   the client PUT but never\
        \ finalized are completed here rather than\n   rejected. Missing/corrupt/oversize\
        \ bytes -> 422; unconfigured\n   storage -> 501. The key is then marked finalized\
        \ in the uploads\n   registry (C7) so ``GET /v1/uploads/public/{key}`` serves\
        \ it.\n\nThe public URL is derived server-side from the finalize metadata\
        \ and\nstored as the message body (encrypted at rest, as before) and as\n\
        ``photo_url`` — the client never supplies a URL. Participant and support\n\
        visibility are unchanged."
      operationId: attach_photo_v1_threads__thread_id__attachments_post
      parameters:
      - name: thread_id
        in: path
        required: true
        schema:
          type: string
          title: Thread Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Attach Photo V1 Threads  Thread Id  Attachments Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /v1/support/threads/{thread_id}/messages:
    get:
      tags:
      - messaging
      - support
      summary: Support Read Messages
      description: 'Support dashboard: decrypted thread view for moderation.


        Support staff only (``SUPPORT_UIDS`` — 403 otherwise, fail closed).

        Not participant-scoped — that is the point — but H2-scoped: a thread is

        readable only while a report names its listing or one of its

        participants, or an open dispute references the listing (403

        ``no_open_case`` otherwise). ``reason`` is a controlled-vocabulary enum

        (free text was self-reported and unauditable). Paginated: ``limit`` <=

        100 with the same opaque cursor as the participant path (M2 — no more

        10k-message decrypt-and-commit storms). Every message returned writes

        one audit row (viewer, thread, message, reason) into

        ``moderation_views`` in a single batched insert.


        Android follow-ups (client-side, not implementable here): in-app copy

        disclosing "Staff may review reported chats", and a user-visible

        "viewed by support" notice on reviewed threads.'
